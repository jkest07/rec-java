name: DevSecOps Java

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


permissions:
  contents: read


jobs:

  # ============================================================
  # JOB 1 - PRUEBAS Y SEGURIDAD
  # ============================================================

  security:

    name: Tests y Seguridad

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Descargar código
      # --------------------------------------------------------

      - name: Descargar repositorio
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # Configurar Java
      # --------------------------------------------------------

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # --------------------------------------------------------
      # Compilar + ejecutar tests
      # --------------------------------------------------------

      - name: Compilar y ejecutar pruebas
        run: mvn -U -B clean package


      # --------------------------------------------------------
      # OWASP Dependency Check
      #
      # IMPORTANTE:
      # Usamos la Action oficial con BD de vulnerabilidades
      # precargada para NO descargar toda NVD en cada pipeline.
      # --------------------------------------------------------

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: "rec-api"
          path: "."
          format: "HTML"
          out: "reports"
          args: >
            --failOnCVSS 7
            --noupdate


      # --------------------------------------------------------
      # Guardar reporte OWASP aunque encuentre vulnerabilidades
      # --------------------------------------------------------

      - name: Guardar reporte OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: ignore


      # --------------------------------------------------------
      # Construir imagen Docker
      # --------------------------------------------------------

      - name: Construir imagen Docker
        run: |
          docker build \
            -t rec-java:${{ github.sha }} \
            .


      # --------------------------------------------------------
      # Trivy
      #
      # Trivy Action ya tiene caché habilitada por defecto.
      # --------------------------------------------------------

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rec-java:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache: true


  # ============================================================
  # JOB 2 - PUBLICAR Y DESPLEGAR
  # ============================================================

  publish-deploy:

    name: Publicar y Desplegar

    needs:
      - security

    # Un Pull Request solamente ejecuta seguridad.
    # El despliegue ocurre únicamente después de un push a main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Descargar código
      # --------------------------------------------------------

      - name: Descargar repositorio
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # Login en Docker Hub
      # --------------------------------------------------------

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Configurar Docker Buildx
      # --------------------------------------------------------

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Construir y publicar imagen Docker
      # --------------------------------------------------------

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rec-java:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rec-java:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # Preparar SSH
      # --------------------------------------------------------

      - name: Preparar SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Desplegar automáticamente en AWS EC2
      # --------------------------------------------------------

      - name: Desplegar en AWS EC2
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            '
              set -e

              cd /opt/rec-java

              echo "=========================================="
              echo "Actualizando repositorio"
              echo "=========================================="

              git pull origin main

              echo "=========================================="
              echo "Descargando imagenes Docker"
              echo "=========================================="

              docker compose pull

              echo "=========================================="
              echo "Actualizando contenedores"
              echo "=========================================="

              docker compose up -d

              echo "=========================================="
              echo "Estado final"
              echo "=========================================="

              docker compose ps
            '