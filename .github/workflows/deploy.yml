name: DevSecOps Java

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


permissions:
  contents: read


jobs:

  security:

    name: Tests y Seguridad

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B test

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:check

      - name: Construir imagen Docker
        run: |
          docker build \
            -t rec-java:${{ github.sha }} \
            .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rec-java:${{ github.sha }} 
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL


  publish-deploy:

    name: Publicar y Desplegar

    needs:
      - security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rec-java:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rec-java:${{ github.sha }}

      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar en AWS EC2
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            '
              cd /opt/rec-java &&
              git pull origin main &&
              docker compose pull &&
              docker compose up -d
            '